<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>群记 · 测试台</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><span class="eyebrow">GROUPBOT LAB</span><h1>在这里，排练一个群。</h1><p>真实机器人 · 虚拟群聊 · 每批独立记忆</p></div><div id="environment" class="badge">连接中</div></header>
<div id="notice" role="status"></div>
<main><aside><section class="card"><h2>开始实验</h2><label>名称<input id="title" value="会议协作实验" maxlength="100"></label><div class="row"><label>并行副本<input id="copies" type="number" min="1" max="8" value="2"></label><label>每批调用上限<input id="limit" type="number" min="1" max="1000" value="80"></label></div><button id="create" class="primary">＋ 开一个交互群</button>
<hr><h3>批量回放</h3><label>测试集<select id="dataset"><option value="">使用下方消息</option></select></label><label>消息数组 / JSONL<textarea id="rows" rows="7" spellcheck="false"></textarea></label><label class="check"><input id="integrate" type="checkbox">每个日期结束时执行通读和整合</label><input id="upload" type="file" accept=".json,.jsonl"><button id="batch">启动批量回放</button><small>副本各自运行。同一批内保持消息顺序。历史数据集默认普通消息，需另加 at: true 的提问。</small></section>
<section class="card"><h2>所有批次 <span id="run-count"></span></h2><div id="runs"></div></section></aside>
<article><section class="card workspace"><div class="bar"><div><span class="eyebrow" id="run-state">尚未选择批次</span><h2 id="run-title">选择实验，观察反应</h2></div><div class="actions"><button id="export" disabled>导出 JSON</button><button id="stop" disabled>停止</button></div></div>
<div id="metrics" class="metrics"></div><div id="chat" class="chat"><div class="empty">创建一个交互群，或同时回放几组数据。<br>普通消息应静默采集，勾选 @ 后机器人回答。</div></div>
<form id="compose"><div class="row"><label>成员<select id="sender"><option value="owner">老张 · 确认人</option><option value="lin">小林 · 普通成员</option><option value="yu">小余 · 普通成员</option></select></label><label>引用编号<input id="reply" placeholder="可选"></label><label class="check"><input id="mention" type="checkbox" checked>@ 机器人</label></div><div class="row"><textarea id="text" rows="2" placeholder="帮我们设计两套开会时间和地点…"></textarea><button id="send" class="primary" disabled>发送</button></div></form></section>
<section class="card"><div class="bar"><h2>记忆与调用</h2><div class="actions"><input id="day" type="date"><button id="read" disabled>通读这一天</button><button id="consolidate" disabled>日终整合</button></div></div><div class="tabs"><button data-tab="memory" class="selected">记忆快照</button><button data-tab="tools">工具调用</button><button data-tab="calls">模型用量</button><button data-tab="log">运行日志</button></div><pre id="details">等待实验开始。</pre></section>
<details class="card"><summary>环境范围</summary><ul id="differences"></ul><p>主对话沿用配置的模型和爱音人设，真实模式会产生 API 用量。测试集应使用虚构或已经授权处理的数据。停止批次保留报告；通读和整合通过测试接口手动触发，便于观察前后变化。</p></details></article></main><script src="/app.js"></script></body></html>
